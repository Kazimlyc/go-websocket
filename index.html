<!doctype html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Room Select</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Sora:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --ink: #191919;
        --muted: #5f5f5f;
        --panel: #ffffff;
        --accent: #ff8f3d;
        --accent-2: #3b82f6;
        --bg-1: #f3efe6;
        --bg-2: #e5f3ff;
        --shadow: 0 30px 70px rgba(0, 0, 0, 0.12);
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100vh;
        font-family: "Sora", ui-sans-serif, system-ui, sans-serif;
        color: var(--ink);
        background: radial-gradient(900px 500px at 20% 0%, #ffe8d0, transparent),
          radial-gradient(700px 500px at 90% 10%, #d9f0ff, transparent),
          linear-gradient(150deg, var(--bg-1), var(--bg-2));
        display: grid;
        place-items: center;
        padding: 24px;
      }

      .card {
        width: min(840px, 100%);
        background: var(--panel);
        border-radius: 28px;
        box-shadow: var(--shadow);
        display: grid;
        grid-template-columns: 1.1fr 1fr;
        overflow: hidden;
      }

      .side {
        padding: 32px;
        background: linear-gradient(160deg, #fff0e3, #fff);
        display: flex;
        flex-direction: column;
        gap: 18px;
      }

      .label {
        font-size: 14px;
        text-transform: uppercase;
        letter-spacing: 2px;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(28px, 4vw, 40px);
        line-height: 1.1;
      }

      p {
        margin: 0;
        color: var(--muted);
      }

      .form {
        padding: 32px;
        display: grid;
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      input {
        border: 1px solid #ddd1c4;
        border-radius: 14px;
        padding: 12px 14px;
        font-size: 15px;
        outline: none;
      }

      input:focus {
        border-color: var(--accent-2);
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
      }

      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .chip {
        border: 1px solid #eadfd2;
        border-radius: 999px;
        padding: 8px 14px;
        font-size: 14px;
        background: #fff;
        cursor: pointer;
      }

      .actions {
        display: flex;
        gap: 12px;
        align-items: center;
      }

      button {
        border: none;
        border-radius: 999px;
        padding: 12px 20px;
        font-weight: 600;
        background: var(--accent);
        color: #24140a;
        cursor: pointer;
        box-shadow: 0 12px 24px rgba(255, 143, 61, 0.25);
      }

      .hint {
        font-size: 13px;
        color: var(--muted);
      }

      @media (max-width: 900px) {
        .card {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="side">
        <div class="label">WebSocket Chat</div>
        <h1>Oda sec, baglan, sohbet et.</h1>
        <p>Basit oda mantigi ile birden fazla sohbet kanali ac.</p>
      </div>
      <form id="joinForm" class="form">
        <div class="field">
          <label for="name">Isim</label>
          <input id="name" name="name" placeholder="kazim" maxlength="24" />
        </div>
        <div class="field">
          <label for="room">Oda</label>
          <input id="room" name="room" placeholder="genel" required />
        </div>
        <div class="field">
          <div class="chips">
            <button type="button" class="chip" data-room="genel">genel</button>
            <button type="button" class="chip" data-room="teknik">teknik</button>
            <button type="button" class="chip" data-room="mola">mola</button>
          </div>
        </div>
        <div class="actions">
          <button type="submit">Odaya gir</button>
          <div class="hint">Oda yoksa otomatik olusur.</div>
        </div>
      </form>
    </div>

    <script>
      const form = document.getElementById("joinForm");
      const roomInput = document.getElementById("room");
      const nameInput = document.getElementById("name");

      document.querySelectorAll(".chip").forEach((chip) => {
        chip.addEventListener("click", () => {
          roomInput.value = chip.dataset.room;
          roomInput.focus();
        });
      });

      form.addEventListener("submit", (event) => {
        event.preventDefault();
        const room = roomInput.value.trim();
        if (!room) return;
        const name = nameInput.value.trim();
        const params = new URLSearchParams();
        params.set("room", room);
        if (name) params.set("name", name);
        window.location.href = `/chat.html?${params.toString()}`;
      });
    </script>
  </body>
</html>
